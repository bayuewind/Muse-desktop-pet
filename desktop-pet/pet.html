<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://muse.ai; media-src https://muse.ai; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Muse 桌宠</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body data-kind="login">
  <main class="pet">
    <div class="handle" title="拖动这里移动桌宠"><span></span></div>
    <button class="hide" id="hide" aria-label="隐藏桌宠">×</button>
    <button class="portrait" id="portrait" aria-label="展开或收起 Muse 聊天窗口" title="点击展开 / 收起聊天 · ⌘⇧M">
      <span class="portrait-media">
        <span class="fallback" aria-hidden="true"><span class="face"><i></i><b>⌣</b><i></i></span></span>
        <img id="still" src="https://muse.ai/avatars/hatch.jpg" alt="Muse 桌宠">
        <video id="avatar" muted autoplay loop playsinline aria-hidden="true"></video>
      </span>
      <span id="unread" class="unread" hidden aria-label="新回复"></span>
    </button>
    <button class="dot" id="menu-dot" aria-label="展开气泡菜单" aria-expanded="false" aria-controls="orbit" title="点击小圆点展开菜单"></button>
    <section class="caption">
      <div class="eyebrow">MUSE COMPANION <span>· 本机</span></div>
      <div id="status" role="status" aria-live="polite">请先登录 Muse</div>
      <p id="detail">点下方按钮打开独立登录窗口</p>
      <button id="open">打开 Muse <span>↗</span></button>
    </section>
  </main>
  <nav id="orbit" class="orbit" aria-label="桌宠气泡菜单" hidden>
    <button class="bubble account-bubble" id="orbit-account" title="登录、切换账号或登出" aria-label="账号：登录、切换或登出">
      <i data-lucide="user-round"></i>
      <span>账号</span>
    </button>
    <button class="bubble slot-one" data-workspace="tasks" aria-label="任务中心" title="任务中心"><i data-lucide="list-checks"></i><span>任务</span></button>
    <button class="bubble slot-two" data-workspace="library" aria-label="近期成果" title="近期成果"><i data-lucide="folder-open"></i><span>成果</span></button>
    <button class="bubble slot-three" data-workspace="settings" aria-label="桌面设置" title="桌面设置"><i data-lucide="settings-2"></i><span>设置</span></button>
  </nav>
  <script src="node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="pet.js"></script>
</body>
</html>
